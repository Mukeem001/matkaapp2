services:
  - type: web
    name: matka-api-server
    env: node
    plan: free
    runtime: node-18
    region: oregon
    buildCommand: "npm install --legacy-peer-deps && npx tsc --build tsconfig.json && cd lib/db && npm run push"
    startCommand: "cd artifacts/api-server && npx tsx ./src/index.ts"
    healthCheckPath: /api/healthz
    healthCheckInterval: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        value: https://matka-api-server.onrender.com
      - key: JWT_SECRET
        sync: false
