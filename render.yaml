services:
  - type: web
    name: matka-api-server
    env: node
    plan: free
    runtime: node-18
    region: oregon
    buildCommand: "npm install --legacy-peer-deps && cd artifacts/api-server && npm install --legacy-peer-deps && npm run build"
    startCommand: "node artifacts/api-server/dist/index.js"
    healthCheckPath: /api/health
    healthCheckInterval: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        value: https://matka-api-server.onrender.com
      - key: JWT_SECRET
        sync: false
