services:
  - type: web
    name: matka-api-server
    env: node
    plan: free
    runtime: node-20
    region: oregon
    buildCommand: "npm install -g pnpm && pnpm install && pnpm build && cd lib/db && pnpm run push"
    startCommand: "cd lib/db && pnpm run migrate && cd ../../artifacts/api-server && node dist/index.js"
    healthCheckPath: /api/healthz
    healthCheckInterval: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        value: https://matka-api-server.onrender.com
      - key: JWT_SECRET
        sync: false
