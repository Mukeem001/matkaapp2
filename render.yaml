services:
  - type: web
    name: matka-api-server
    env: node
    plan: free
    runtime: node-18
    region: oregon
    buildCommand: "rm -rf artifacts/api-server/node_modules lib/db/node_modules lib/api-zod/node_modules lib/api-client-react/node_modules artifacts/admin-panel/node_modules && npm ci --legacy-peer-deps"
    startCommand: "cd artifacts/api-server && npx tsx ./src/index.ts"
    healthCheckPath: /api/health
    healthCheckInterval: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        value: https://matka-api-server.onrender.com
      - key: JWT_SECRET
        sync: false
