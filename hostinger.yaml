# Hostinger Node.js Application Configuration
runtime: node:18

# Application entry point
entrypoint: npm start

# Build commands
commands:
  install: npm install
  build: npm run build
  start: npm start

# Environment variables required
env:
  NODE_ENV: production
  PORT: 4000

# Health check
health_check:
  path: /api/health
  interval: 30
  timeout: 10
